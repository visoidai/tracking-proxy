events {}
http {
    map $uri $posthog_host {
        default eu.i.posthog.com;
        ~^/relay/(static|array)/ eu-assets.i.posthog.com;
    }

    map $request_uri $posthog_path {
        ~^/relay(?<posthog_request_path>/.*)$ $posthog_request_path;
        default /;
    }

    map $http_origin $posthog_cors_origin {
        default "";
        "~^https://(?:app\.visoid\.com|[a-z0-9-]+--visoid\.netlify\.app)$" $http_origin;
    }

    server {
        listen 80 default_server backlog=16384;
        listen [::]:80 default_server backlog=16384;

        location ^~ /relay/ {
            resolver 8.8.8.8 8.8.4.4 valid=300s ipv6=off;
            client_max_body_size 20m;
            access_log off;

            add_header Access-Control-Allow-Origin $posthog_cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
            add_header Access-Control-Max-Age 3600 always;
            add_header Vary Origin always;

            if ($request_method = OPTIONS) {
                return 204;
            }
            if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
                return 405;
            }

            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Connection "";
            proxy_set_header Host $posthog_host;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;

            proxy_ssl_server_name on;
            proxy_ssl_name $posthog_host;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_pass https://$posthog_host$posthog_path;
        }

        # Serve Mixpanel library
        location /lib.min.js {
            proxy_set_header X-Real-IP $http_x_forwarded_for;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_pass https://cdn.mxpnl.com/libs/mixpanel-2-latest.min.js;
        }

        # API Routes
        location /t/ {
            rewrite ^/t/(.*)$ /track/$1 break;
            proxy_set_header Host api-eu.mixpanel.com;
            proxy_set_header X-Real-IP $http_x_forwarded_for;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_pass https://api-eu.mixpanel.com;
        }

        location /e/ {
            rewrite ^/e/(.*)$ /engage/$1 break;
            proxy_set_header Host api-eu.mixpanel.com;
            proxy_set_header X-Real-IP $http_x_forwarded_for;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_pass https://api-eu.mixpanel.com;
        }

        location /g/ {
            rewrite ^/g/(.*)$ /groups/$1 break;
            proxy_set_header Host api-eu.mixpanel.com;
            proxy_set_header X-Real-IP $http_x_forwarded_for;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_pass https://api-eu.mixpanel.com;
        }

        location /r/ {
            rewrite ^/r/(.*)$ /record/$1 break;
            proxy_set_header Host api-eu.mixpanel.com;
            proxy_set_header X-Real-IP $http_x_forwarded_for;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header Access-Control-Allow-Headers authorization,content-type;

            set $cors_origin "";
            if ($http_origin ~* "^https?://(app.visoid.com|.*--visoid.netlify.app)$") {
                set $cors_origin $http_origin;
            }
            proxy_set_header Access-Control-Allow-Origin $cors_origin;
            proxy_pass https://api-eu.mixpanel.com;
        }

        location / {
            proxy_set_header Host api-eu.mixpanel.com;
            proxy_set_header X-Real-IP $http_x_forwarded_for;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_pass https://api-eu.mixpanel.com/;
        }
    }
}
